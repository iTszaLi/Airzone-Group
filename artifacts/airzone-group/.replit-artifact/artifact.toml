kind = "web"
previewPath = "/"
title = "Airzone Group"
description = "A premium corporate website for Airzone Group, bringing together logistics and customs services with travel and tourism enquiries, shipment tracking, and secure business administration."
version = "1.0.0"
id = "artifacts/airzone-group"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21365

[services.development]
run = "pnpm --filter @workspace/airzone-group run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/airzone-group", "run", "build" ]
run = "pnpm --filter @workspace/airzone-group run serve"

[services.env]
PORT = "21365"
BASE_PATH = "/"
